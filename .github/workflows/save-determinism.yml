name: Save determinism
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy -p oh_save -p oh_cli -p oh_sim -p oh_data --all-targets --locked -- -D warnings
      - run: cargo test -p oh_save -p oh_cli -p oh_sim -p oh_data --locked
      - name: Test evidence gate failures
        run: python -m unittest discover -s crates/oh_save/tests -p test_save_evidence.py -v
      - name: Test separate current evidence and required input gate failures
        run: python -m unittest discover -s crates/oh_save/tests -p test_save_current_evidence.py -v
      - name: Capture two actual M1 native saves and fresh process resumes
        run: python crates/oh_save/tools/check_save_determinism.py capture --out target/save-determinism
      - name: Capture two current M1 saves, full state and fresh native CLI resumes
        run: python crates/oh_save/tools/check_save_current.py capture --out target/save-current
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.4.0'
      - name: Build this checkout's embedded client and native server
        run: |
          npm --prefix client ci
          npm --prefix client run build
          cargo build -p oh_server --locked
      - name: Actual exclusive saved server and authoritative wire query
        run: python crates/oh_server/tests/save_native.py --capture target/save-current --out target/save-current/server
      - name: Current force restore retains full host validation and wire assertions
        run: python crates/oh_server/tests/save_native.py --capture target/save-current --out target/save-current/server-force --force
      - name: Historical mutable v1 remains CLI-only and is refused by the server
        run: python crates/oh_server/tests/save_historical_native.py --capture target/save-determinism --out target/save-determinism/server-rejected
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: save-${{ matrix.os }}
          path: target/save-determinism/
          if-no-files-found: error
          archive: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-save-${{ matrix.os }}
          path: target/save-current/
          if-no-files-found: error
          archive: true
  compare:
    needs: save
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: save-*
          path: save-evidence
          merge-multiple: false
      - name: Require same HEAD, bytes SHA and independent canonical hash from every OS
        run: python crates/oh_save/tools/check_save_determinism.py compare --root save-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: current-save-*
          path: save-current-evidence
          merge-multiple: false
      - name: Require separate current same HEAD, native exits, full state and identities from every OS
        run: python crates/oh_save/tools/check_save_current.py compare --root save-current-evidence
