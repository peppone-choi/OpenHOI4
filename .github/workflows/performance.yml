name: Fixed baseline performance
on:
  push:
    branches: [main, codex/wp25-repro-bench-m2r2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Comparison boundary and evidence rejection tests
        run: python -X utf8 -m unittest discover -s bench -p test_compare.py -v
      - name: Actual CLI stdin recording and hostile bundle native tests
        run: |
          cargo build -p oh_cli --locked
          cargo build -p oh_save --examples --locked
          python -X utf8 crates/oh_cli/tests/repro_native.py
      - name: Same Linux runner fixed baseline and current native library measurement
        run: python -X utf8 bench/run.py --out target/performance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: performance-linux
          path: |
            target/performance/*.json
            target/performance/*.stdout
            target/performance/*.stderr
            target/performance/*.txt
            target/performance/*-driver/Cargo.toml
            target/performance/*-driver/Cargo.lock
            target/performance/*-driver/src/main.rs
            target/evidence/WP-25/
            target/evidence/WP-25-M2-r2/
          if-no-files-found: error
          archive: true
