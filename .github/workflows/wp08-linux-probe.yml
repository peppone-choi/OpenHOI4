name: WP08 temporary Linux capability diagnosis
on:
  push:
    branches: [codex/wp08-map-rendering]
permissions:
  contents: read
jobs:
  capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.4.0'
      - run: npm --prefix client ci
      - name: Install the same pinned Playwright browsers and dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Native headless capability and exact clear/readPixels
        env:
          DEBUG: pw:browser
        run: node tools/wp08_linux_probe.cjs
      - name: Same browser build under temporary Xvfb display
        if: always()
        env:
          DEBUG: pw:browser
        run: xvfb-run -a node tools/wp08_linux_probe.cjs --headed
      - name: Preserve raw capability evidence (no game validation claim)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wp08-linux-capability-probe
          path: target/wp08/linux-probe/
          if-no-files-found: error
