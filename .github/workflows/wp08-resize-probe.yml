name: WP08 temporary Linux resize diagnosis
on:
  push:
    branches: [codex/wp08-map-rendering]
permissions:
  contents: read
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.4.0'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - run: cargo build -p oh_server --locked
      - working-directory: client
        run: npx playwright install --with-deps chromium webkit
      - name: Same full M1 suite and two workers with read-only geometry trace
        working-directory: client
        env:
          OH_TEST_PORT: '19439'
          OH_RESIZE_PHASE_EVIDENCE: ../target/wp08/resize-probe/full
          OH_MAP_RESIZE_EVIDENCE: ../target/wp08/resize-probe/full/pixels
        run: npm run test:e2e -- --config playwright.resize-probe.config.ts --project chromium --project webkit --workers 2
      - name: Isolated resize fixture with same assertions and timeout
        if: always()
        working-directory: client
        env:
          OH_TEST_PORT: '19440'
          OH_RESIZE_PHASE_EVIDENCE: ../target/wp08/resize-probe/isolated
          OH_MAP_RESIZE_EVIDENCE: ../target/wp08/resize-probe/isolated/pixels
        run: npm run test:e2e -- --config playwright.resize-probe.config.ts --project=chromium --project=webkit --workers 1 map-resize.spec.ts
      - name: Preserve raw phase diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wp08-linux-resize-probe
          path: target/wp08/resize-probe/
          if-no-files-found: error
