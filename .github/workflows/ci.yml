name: CI

on:
  push:
  pull_request:
  schedule:
    # 03:17 Asia/Seoul supplemental run; all three OS also run on every push.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.4.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build embedded production client before Rust server
        run: |
          npm --prefix client ci
          npm --prefix client run build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Enforce simulation dependency boundaries
        run: python tools/check_architecture.py
      - run: cargo run -p oh_proto --locked --example wire_fixtures
      - name: Real executable HTTP and Ctrl+C lifecycle
        run: python crates/oh_server/tests/lifecycle.py

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.4.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install pinned Rust for protocol generation and real server
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: npm --prefix client ci
      - name: Regenerate protocol types and reject stale bindings
        run: |
          cargo run -p oh_proto --locked --example generate
          git diff --exit-code -- client/src/proto
      - run: npm --prefix client run typecheck
      - run: npm --prefix client test
      - run: npm --prefix client run build
      - run: cargo build -p oh_server --locked
      - name: Browser compatibility and Rust-server WebSocket E2E
        env:
          OH_E2E_EVIDENCE: ../target/wp09/ci/m0-e2e
          OH_MALFORMED_EVIDENCE: ../target/wp09/ci/m0-malformed
        working-directory: client
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Actual M1 panels, ownership/control, ledger and malformed wire E2E
        working-directory: client
        env:
          OH_TEST_PORT: '19412'
          OH_E2E_EVIDENCE: ../target/wp09/ci/m1-e2e
          OH_MALFORMED_EVIDENCE: ../target/wp09/ci/m1-malformed
        run: npm run test:e2e -- --config playwright.m1.config.ts --project chromium --project webkit
      - name: Native headless Firefox backend availability and authority
        working-directory: client
        env:
          OH_TEST_PORT: '19413'
          OH_MAP_CAPABILITY_EVIDENCE: ../target/wp08/ci/firefox-native-headless
        run: npm run test:e2e -- --config playwright.m1.config.ts --project=firefox map-capability.spec.ts
      - name: Full Firefox M1 pixels and authority under temporary Xvfb display
        working-directory: client
        env:
          OH_TEST_PORT: '19414'
          OH_MAP_EVIDENCE: ../target/wp08/ci/firefox-xvfb-map
          OH_MAP_REDIRECT_EVIDENCE: ../target/wp08/ci/firefox-xvfb-redirect
          OH_MAP_CAPABILITY_EVIDENCE: ../target/wp08/ci/firefox-xvfb-capability
          OH_E2E_EVIDENCE: ../target/wp09/ci/firefox-xvfb-m1-e2e
          OH_MALFORMED_EVIDENCE: ../target/wp09/ci/firefox-xvfb-m1-malformed
        run: xvfb-run -a npm run test:e2e -- --config playwright.m1.config.ts --project firefox --headed
      - name: Upload protocol and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp05-protocol-browser-evidence
          path: |
            target/wp05/
            target/wp09/
            target/wp08/
            client/test-results/
          if-no-files-found: error
          archive: true

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check licenses bans advisories sources
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.4.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: npm --prefix client ci
      - run: npm --prefix client run licenses
      - name: Requirement and violation fixtures
        run: python -m unittest discover -s tools/tests -p test_wp01.py -v

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python tools/check_assets.py --release

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python tools/check_docs.py
