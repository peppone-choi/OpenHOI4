# Original M0 time configuration; tentative pacing from 02 §5.3.
# No economic, military, political or historical coefficients.
[time]
speed_ms_per_tick = [500, 200, 80, 25, 0]
initial_speed = 1

# Host transport settings, outside deterministic simulation state.
[network]
delta_ms = 100
command_capacity = 128
max_message_bytes = 65536
handshake_timeout_ms = 5000
default_seed = 1
